[project]
name = "$REPO_NAME"
version = "0.1.0"
description = "$REPO_DESCRIPTION"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.uv]
package = false # an app, not a library: the code runs from src/

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "Q", "C4", "FAST", "N", "PT", "ERA", "D", "complex-structure", "S"]
ignore = [
    "undocumented-public-init",
    # From S, the rules that guess from a name or an import: on Meru's code they only raised false alarms.
    "assert",
    "hardcoded-bind-all-interfaces",
    "hardcoded-password-string",
    "start-process-with-partial-path",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "unused-async"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ty.environment]
extra-paths = ["src"]
